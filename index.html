*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:
  radial-gradient(1100px 560px at 88% -12%,rgba(31,215,154,.08),transparent 60%),
  radial-gradient(820px 460px at -6% 112%,rgba(0,89,59,.18),transparent 55%),var(--bg);
  color:var(--txt);font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* Iskra só na marca e nos títulos; dados/tabelas em fonte limpa p/ leitura */
.brand b,.topbar h1,.vhead h2{font-family:'Iskra CYR','Segoe UI',system-ui,sans-serif}
.logo{flex:0 0 auto;display:block}
.logo svg{display:block;width:100%;height:100%}
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

/* ---------- SIDEBAR (desktop) ---------- */
.rail{background:linear-gradient(180deg,var(--bg2),#0A110E);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:14px;padding:6px 8px 18px}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--verde));box-shadow:0 6px 18px rgba(31,215,154,.35);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06130d;font-size:17px}
.brand b{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.05}
.brand small{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1.6px;margin-top:5px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:8px;margin-top:10px;overflow-y:auto;flex:1 1 auto;min-height:0;padding-right:4px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.navit{display:flex;align-items:center;gap:15px;padding:14px 15px;border-radius:16px;color:var(--txt2);cursor:pointer;border:1px solid transparent;transition:.25s}
.navit .ic{width:46px;height:46px;border-radius:13px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;border:1px solid var(--line);transition:.25s}
.navit .tx{font-size:17px;font-weight:700;line-height:1.15;letter-spacing:-.2px}
.navit .tx small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-top:2px}
.navit .bdg{margin-left:auto;font-size:12.5px;font-weight:800;background:rgba(255,91,23,.2);color:var(--verm);border-radius:999px;padding:3px 10px;min-width:26px;text-align:center}
.navit:hover{background:var(--surface);color:var(--txt)}
.navit:hover .ic{transform:scale(1.05)}
.navit.on{background:linear-gradient(135deg,rgba(31,215,154,.14),rgba(31,215,154,.04));border-color:rgba(31,215,154,.22);color:#fff}
.navit.on .ic{color:#06130d;box-shadow:0 6px 16px rgba(0,0,0,.35);border:none}
.navit.on .tx small{color:var(--teal)}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.rail-foot .live{display:inline-flex;align-items:center;gap:6px;color:var(--teal);text-transform:uppercase;letter-spacing:1px;font-size:10px;margin-top:5px}
.rail-foot .live i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ---- Motion ---- */
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vfade{animation:vfade .3s ease}
@media (prefers-reduced-motion:reduce){.vfade,.view>*{animation:none!important}}

/* ---------- MAIN ---------- */
main{display:flex;flex-direction:column;min-width:0}
.faixa{height:4px;background:linear-gradient(90deg,#00593B,#00AE86 22%,#F4C430 45%,#F7A519 62%,#FF5B17 82%,#8a2b2b)}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,12,10,.82);backdrop-filter:blur(12px);z-index:20}
.topbar .mlogo{display:none;align-items:center;gap:9px}
.topbar .mlogo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--verde));display:flex;align-items:center;justify-content:center;font-weight:800;color:#06130d;font-size:15px}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.topbar h1 small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.3px;text-transform:none;margin-top:1px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:230px;transition:.2s}
.search:focus-within{border-color:rgba(31,215,154,.4);box-shadow:0 0 0 3px rgba(31,215,154,.08)}
.search svg{flex:0 0 auto;opacity:.6}
.search input{background:none;border:none;outline:none;color:var(--txt);font:inherit;font-size:13.5px;width:100%}
.search input::placeholder{color:var(--mut)}
.pos{font-size:11.5px;color:var(--mut);text-align:right;line-height:1.4;white-space:nowrap}
.pos b{color:var(--txt2)}
.hamb{display:none}

.view{padding:22px 26px 110px;max-width:1220px;width:100%;margin:0 auto}
.vhead{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vhead .idx{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:2px}
.vhead h2{font-size:24px;font-weight:800;letter-spacing:-.5px}
.vhead .sub{color:var(--mut);font-size:12.5px;margin-left:auto;text-align:right;line-height:1.4}
.tag{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(31,215,154,.14);color:var(--teal);text-transform:uppercase;letter-spacing:1px;border:1px solid rgba(31,215,154,.25)}
.tag.red{background:rgba(255,107,107,.14);color:var(--verm);border-color:rgba(255,107,107,.3)}
.tag.amb{background:rgba(255,194,75,.14);color:var(--ambar);border-color:rgba(255,194,75,.3)}
.tag.sam{background:#0057A8;color:#fff;border:none;font-size:13px;padding:6px 12px}

.kpis{display:grid;gap:14px;margin-bottom:18px;grid-template-columns:repeat(4,1fr)}
.kpi{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--glow);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;right:-28px;top:-28px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,rgba(31,215,154,.09),transparent 70%)}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.kpi .v{font-size:34px;font-weight:800;line-height:1.05;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.kpi .v small{font-size:14px;color:var(--mut);font-weight:600;letter-spacing:0}
.kpi.ok .v{color:var(--teal)} .kpi.amb .v{color:var(--ambar)} .kpi.red .v{color:var(--verm)}
.kpi.accent{background:linear-gradient(180deg,rgba(31,215,154,.12),var(--surface));border-color:rgba(31,215,154,.22)}
.kpi.blue{background:linear-gradient(180deg,rgba(0,87,168,.16),var(--surface));border-color:rgba(92,200,255,.22)}

.grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--glow);padding:16px 18px}
.card h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:12px}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ringwrap .big{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin-top:-104px;margin-bottom:64px}
.ringwrap .cap{font-size:12px;color:var(--mut);text-align:center}

table{width:100%;border-collapse:collapse;font-size:14.5px}
thead th{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line2);text-align:center;position:sticky;top:0;background:var(--surface)}
thead th.l{text-align:left}
tbody td{padding:13px 8px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;white-space:nowrap}
tbody td.l{text-align:left;font-weight:600;font-size:14.5px;white-space:normal}
tbody td.l small{display:block;color:var(--mut);font-size:11px;font-weight:600}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:nth-child(even){background:rgba(255,255,255,.022)}
tbody tr:hover{background:var(--surface2)}
thead th.l{width:32%} thead th:not(.l){width:13%}
tbody tr:last-child td{border-bottom:none}
.mut{color:var(--mut)} .cr{color:var(--verm)} .cg{color:var(--teal)} .ca{color:var(--ambar)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
.pill.red{background:rgba(255,107,107,.18);color:var(--verm)}
.pill.ok{background:rgba(31,215,154,.18);color:var(--teal)}
.pill.amb{background:rgba(255,194,75,.18);color:var(--ambar)}
.barwrap{display:flex;align-items:center;gap:9px;justify-content:center}
.bar{height:11px;border-radius:6px;background:var(--elev);overflow:hidden;width:124px;flex:0 0 auto}
.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.barv{font-size:12px;min-width:38px;text-align:left;color:var(--mut)}
.alert{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(255,107,107,.12),transparent);border:1px solid rgba(255,107,107,.25);border-radius:14px;padding:13px 16px;margin-bottom:16px;font-size:14px}
.alert .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,107,107,.18);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.alert b{color:#fff}
.cds{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cd{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--txt2)}
.cd b{color:#fff}
.note{color:var(--mut);font-size:11.5px;margin-top:10px;line-height:1.5}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-size:14px}

/* chart */
.chartbox{position:relative;height:200px}
.chartbox svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--txt2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* ---------- MOBILE TABBAR + DRAWER ---------- */
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(10,17,14,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--mut);border-radius:12px;cursor:pointer;position:relative}
.tab .ic{font-size:18px;line-height:1}
.tab .lb{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.tab.on{color:var(--teal)}
.tab .dotb{position:absolute;top:3px;right:50%;transform:translateX(16px);width:7px;height:7px;border-radius:50%;background:var(--verm)}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.drawer.open .sheet{transform:translateY(0)}
.sheet .grab{width:42px;height:4px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.3px}
.sheet .skuid{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border:none}
.drow .k{color:var(--txt2);font-size:13.5px}
.drow .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}

.themebtn{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--txt2);font-size:17px;cursor:pointer;transition:.2s}
.themebtn:hover{border-color:var(--teal);color:var(--teal)}

/* ---------- TEMA CLARO (BP cream) ---------- */
body.light{
  --bg:#F3ECDC;--bg2:#EFE6D2;--surface:#FFFFFF;--surface2:#FBF6EA;--elev:#ECE3D1;
  --line:rgba(23,58,46,.10);--line2:rgba(23,58,46,.20);
  --txt:#173A2E;--txt2:#3C5A4C;--mut:#8A9A8E;
  --verm:#E4572E;--glow:0 8px 24px rgba(23,58,46,.10);
  background:radial-gradient(1100px 560px at 88% -12%,rgba(0,174,134,.10),transparent 60%),
    radial-gradient(820px 460px at -6% 112%,rgba(247,196,48,.16),transparent 55%),var(--bg);
}
body.light .rail{background:linear-gradient(180deg,#FBF6EA,#F0E7D3)}
body.light .topbar{background:rgba(243,236,220,.86)}
body.light .tabbar{background:rgba(251,246,234,.95)}
body.light tbody tr:nth-child(even){background:rgba(23,58,46,.035)}
body.light tbody tr:hover,body.light .navit:hover{background:#F1E8D4}
body.light .search,body.light .themebtn{background:#FBF6EA}
body.light .kpi{background:linear-gradient(180deg,#FFFFFF,#FBF6EA)}
body.light .kpi.accent{background:linear-gradient(180deg,rgba(0,174,134,.10),#FFFFFF)}
body.light .kpi.blue{background:linear-gradient(180deg,rgba(0,87,168,.08),#FFFFFF)}
body.light .pill.ok{background:rgba(0,174,134,.15)} body.light .cg{color:var(--teal-d)}

@media(min-width:1700px){ :root{--rail:300px} .view{max-width:1680px} .kpi .v{font-size:40px} table{font-size:16px} }

/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:flex}
  .topbar{padding:12px 16px}
  .topbar .mlogo{display:flex}
  .topbar h1{display:none}
  .pos{display:none}
  .search{min-width:0;flex:1;margin-left:0;padding:8px 11px}
  .view{padding:16px 14px 100px}
  .vhead h2{font-size:20px}
  .vhead .sub{width:100%;text-align:left;margin-left:0}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi .v{font-size:27px}
  .grid2{grid-template-columns:1fr}
  .bar{width:70px}
  /* make tables horizontally scrollable */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  table{min-width:540px}
  thead th{position:static}
}
</style>

function fyChart(c25,c26,proj,col){
  col=col||'#13C79A'; const cid=col.replace('#','');
  const W=720,H=250,pl=14,pr=60,pt=16,pb=26;
  const all=c25.concat(c26,proj||[]); const max=Math.max.apply(0,all)*1.08;
  const xs=i=>pl+(W-pl-pr)*(i/11), ys=v=>H-pb-(H-pt-pb)*(v/max);
  const line=a=>a.map((v,i)=>`${i?'L':'M'} ${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ');
  const p26=c26.map((v,i)=>[xs(i),ys(v)]);
  const d26=p26.map((q,i)=>`${i?'L':'M'} ${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' ');
  const area=d26+` L ${p26[p26.length-1][0].toFixed(1)} ${(H-pb).toFixed(1)} L ${p26[0][0].toFixed(1)} ${(H-pb).toFixed(1)} Z`;
  let dpj=''; if(proj&&proj.length){const st=c26.length-1; const pj=[c26[st]].concat(proj); dpj=pj.map((v,k)=>`${k?'L':'M'} ${xs(st+k).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ');}
  const M=['J','F','M','A','M','J','J','A','S','O','N','D'];
  const labs=M.map((m,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-7}" fill="var(--mut)" font-size="10.5" text-anchor="middle">${m}</text>`).join('');
  const gl=[0,.25,.5,.75,1].map(f=>{const y=(H-pb-(H-pt-pb)*f).toFixed(1);return `<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;}).join('');
  const e25=c25[c25.length-1], e26=(proj&&proj.length)?proj[proj.length-1]:c26[c26.length-1];
  const k=v=>(v/1000).toFixed(1).replace('.',',')+'k';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${gl}
    <defs><linearGradient id="g${cid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".24"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g${cid})"/>
    <path d="${line(c25)}" fill="none" stroke="#8A9A8E" stroke-width="2.4" opacity=".9"/>
    <path d="${d26}" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round"/>
    ${dpj?`<path d="${dpj}" fill="none" stroke="${col}" stroke-width="3.2" stroke-dasharray="6 5" opacity=".85"/>`:''}
    <circle cx="${xs(11).toFixed(1)}" cy="${ys(e25).toFixed(1)}" r="4" fill="#8A9A8E"/>
    <circle cx="${xs(11).toFixed(1)}" cy="${ys(e26).toFixed(1)}" r="5" fill="${col}"/>
    <text x="${(W-pr+8)}" y="${(ys(e25)+16).toFixed(1)}" fill="#8A9A8E" font-size="12" font-weight="700">${k(e25)}</text>
    <text x="${(W-pr+8)}" y="${(ys(e26)-7).toFixed(1)}" fill="${col}" font-size="14" font-weight="800">${k(e26)}</text>
    ${labs}</svg>
    <div class="legend"><span><i style="background:#8A9A8E"></i>2025 acumulado</span><span><i style="background:${col}"></i>2026 acumulado</span><span><i style="background:${col};opacity:.6"></i>projeção Out–Dez</span></div>`;
}

const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function animIn(v){
  if(RM) return;
  let i=0; [...v.children].forEach(el=>{ el.style.animation='rise .5s cubic-bezier(.2,.8,.2,1) both'; el.style.animationDelay=(i++*45)+'ms'; });
  countUp(v); drawCharts(v);
}
function countUp(v){
  v.querySelectorAll('.kpi .v').forEach(el=>{
    const t=el.firstChild; if(!t||t.nodeType!==3) return;
    const raw=t.nodeValue.trim(); if(!/^\d[\d.]*$/.test(raw)) return;
    const target=parseInt(raw.replace(/\./g,''),10); if(!isFinite(target)||target<10) return;
    const dur=850, t0=performance.now();
    const step=now=>{const p=Math.min(1,(now-t0)/dur); t.nodeValue=Math.round(target*(1-Math.pow(1-p,3))).toLocaleString('pt-BR'); if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function drawCharts(v){
  v.querySelectorAll('svg path[fill="none"][stroke]:not([stroke-dasharray])').forEach(p=>{
    try{const len=p.getTotalLength(); if(!len) return; p.style.transition='none'; p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p.getBoundingClientRect(); p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1)'; p.style.strokeDashoffset='0';}catch(e){}
  });
}

function rRes(){
  const meta=DATA.meta, real=(DATA.evolucao&&DATA.evolucao.fat_mtd)||DATA.realizado;
  const pct=meta?Math.round(real/meta*100):0;
  const du=DATA.du, dut=DATA.dut, ritmo=dut&&du?Math.round(pct/ (du/dut) ):0;
  // ring
  const R=74, C=2*Math.PI*R, off=C*(1-Math.min(1,pct/100));
  const ring=`<svg viewBox="0 0 180 180" width="180" height="180">
     <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--elev)" stroke-width="14"/>
     <circle cx="90" cy="90" r="${R}" fill="none" stroke="url(#gr)" stroke-width="14" stroke-linecap="round"
       stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" transform="rotate(-90 90 90)"
       style="transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)" id="ringc"/>
     <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FD79A"/><stop offset="1" stop-color="#5CC8FF"/></linearGradient></defs></svg>`;
  // line chart of acumulado as % of meta
  const serie=(DATA.evolucao&&DATA.evolucao.serie)||[];
  let chart='';
  if(serie.length){
    const W=560,H=190,pad=8;
    const maxP=Math.max(...serie.map(p=>p.acum/meta*100),pct,5);
    const xs=i=>pad+(W-2*pad)*(i/(serie.length-1||1));
    const ys=val=>H-pad-(H-2*pad)*(val/ (maxP*1.1));
    const pts=serie.map((p,i)=>[xs(i),ys(p.acum/meta*100)]);
    const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
    const area=d+` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`;
    const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#1FD79A"/>`).join('');
    const labs=serie.map((p,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-1}" fill="#6F8A7D" font-size="9" text-anchor="middle">D${p.d}</text>`).join('');
    chart=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H+8}" preserveAspectRatio="none">
      <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(31,215,154,.28)"/><stop offset="1" stop-color="rgba(31,215,154,0)"/></linearGradient></defs>
      <path d="${area}" fill="url(#ar)"/>
      <path d="${d}" fill="none" stroke="#1FD79A" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${labs}</svg></div>
      <div class="legend"><span><i style="background:#1FD79A"></i>% da meta acumulado no mês</span></div>`;
  }
  setTimeout(()=>{const rc=document.getElementById('ringc');if(rc)rc.style.strokeDashoffset=off.toFixed(1);},60);
  return `
  <div class="vhead"><span class="idx">04</span><h2>Resultado</h2><span class="tag">material interno · só %</span>
    <div class="sub">Realização da meta do mês · ${du} de ${dut} dias úteis<br>sem valores — apenas escala percentual</div></div>
  <div class="grid2">
    <div class="card"><h3>Meta do mês</h3>
      <div class="ringwrap">${ring}<div class="big">${pct}%</div><div class="cap">realizado sobre a meta<br><b style="color:var(--txt2)">ritmo ${ritmo}% do esperado</b> p/ ${du}/${dut} DU</div></div></div>
    <div class="card"><h3>Evolução no mês (% da meta)</h3>${chart||'<div class="empty">Sem série</div>'}</div>
  </div>
  <div class="kpis" style="margin-top:16px">
    <div class="kpi ${pct>=100?'ok':'amb'}"><div class="l">% da meta</div><div class="v">${pct}<small>%</small></div></div>
    <div class="kpi"><div class="l">Dias úteis</div><div class="v">${du}<small>/${dut}</small></div></div>
    <div class="kpi ${ritmo>=100?'ok':'amb'}"><div class="l">Ritmo vs esperado</div><div class="v">${ritmo}<small>%</small></div></div>
    <div class="kpi"><div class="l">Falta p/ meta</div><div class="v">${Math.max(0,100-pct)}<small>%</small></div></div>
  </div>`;
}

// ---------- DRILL-DOWN ----------
function findAll(sku){
  const o={sku};
  (DATA.producao.itens||[]).forEach(x=>{if(x.sku===sku){o.nome=x.nome;o.nec=x.proj;o.liq=x.liq;o.prod=x.prod_bruto;o.exped=x.exped;}});
  (DATA.pedidos.itens||[]).forEach(x=>{if(x.sku===sku){o.nome=o.nome||x.nome;o.cartx=x.cart;o.est=x.est;o.cob=x.cob;o.faltaSup=x.falta;}});
  (DATA.ruptura.itens||[]).forEach(x=>{if(x.sku===sku){o.nome=o.nome||x.nome;o.est=x.est;o.min=x.min;o.faltaMin=x.falta;o.cartTot=x.cart;o.faltaPed=x.falta_ped;}});
  (DATA.sams.itens||[]).forEach(x=>{if(x.sku===sku){o.nome=o.nome||x.nome;o.samPed=x.ped;o.est=(o.est!=null?o.est:x.est);o.samNec=x.nec60;}});
  return o;
}
function drow(k,v,cls){return v==null?'':`<div class="drow"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`;}
function drill(sku){
  const o=findAll(sku);
  const sheet=document.getElementById('sheet');
  let body='<div class="grab"></div>';
  body+=`<h3>${o.nome||('SKU '+sku)}</h3><div class="skuid">Código #${sku} · caixas acabadas</div>`;
  body+=drow('Necessidade (carteira+mín.)', o.nec!=null?fmt(o.nec)+' cx':null);
  body+=drow('Produção líquida (mês)', o.liq!=null?fmt(o.liq)+' cx':null,'cg');
  body+=drow('Produzido / Expedido', (o.prod!=null)?`${fmt(o.prod)} / ${fmt(o.exped)} cx`:null,'mut');
  body+=drow('Estoque expedição', o.est!=null?fmt(o.est)+' cx':null);
  body+=drow('Estoque mínimo', o.min!=null?fmt(o.min)+' cx':null,'mut');
  body+=drow('Carteira total', o.cartTot!=null?fmt(o.cartTot)+' cx':(o.cartx!=null?fmt(o.cartx)+' cx':null));
  if(o.cartx!=null && o.cartTot!=null && o.cartTot!==o.cartx) body+=drow('— carteira própria (excl. SAM\'s)', fmt(o.cartx)+' cx');
  if(o.samPed!=null) body+=drow("Pedido SAM's (não faturado)", fmt(o.samPed)+' cx','');
  if(o.samNec!=null) body+=drow("Necessidade 60d SAM's", fmt(o.samNec)+' cx','mut');
  body+=drow('Falta p/ mínimo', o.faltaMin>0?'−'+fmt(o.faltaMin)+' cx':(o.faltaMin===0?'OK':null), o.faltaMin>0?'ca':'cg');
  body+=drow('Falta p/ pedidos', o.faltaPed>0?'−'+fmt(o.faltaPed)+' cx':(o.faltaPed===0?'OK':null), o.faltaPed>0?'cr':'cg');
  body+=drow('Cobertura (estoque÷carteira)', o.cob!=null?o.cob+'%':null, o.cob>=100?'cg':o.cob>=40?'ca':'cr');
  sheet.innerHTML=body;
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}

// ---- tema claro/escuro ----
(function(){
  try{ if(localStorage.getItem('bp_theme')==='light') document.body.classList.add('light'); }catch(e){}
  const b=document.getElementById('theme');
  const setIcon=()=>{b.textContent=document.body.classList.contains('light')?'☾':'☀︎';};
  setIcon();
  b.onclick=()=>{document.body.classList.toggle('light');try{localStorage.setItem('bp_theme',document.body.classList.contains('light')?'light':'dark');}catch(e){} setIcon();};
})();

// ---- modo TV: rotação automática (pausa ao interagir) ----
let _rot=null,_idle=null;
const TVMODE=/[?&]tv=1/.test(location.search);
function startRot(){ if(!TVMODE || window.innerWidth<1200) return; stopRot();
  _rot=setInterval(()=>{const i=SCREENS.findIndex(s=>s.id===cur); go(SCREENS[(i+1)%SCREENS.length].id);},20000); }
function stopRot(){ if(_rot){clearInterval(_rot);_rot=null;} }
function kick(){ stopRot(); clearTimeout(_idle); _idle=setTimeout(startRot,60000); }
['click','touchstart','keydown','mousemove','wheel'].forEach(ev=>document.addEventListener(ev,kick,{passive:true}));
startRot();
// recarrega de hora em hora só no modo TV (p/ quando a fonte de dados for atualizada)
if(TVMODE) setTimeout(()=>location.reload(), 3600000);
</script>
